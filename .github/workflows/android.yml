name: Android CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

  lint:
    name: Run lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check
        run: bash ./gradlew :app:spotlessCheck

      - name: Android Lint
        run: bash ./gradlew :app:lintDebug

  build:
    name: Build APKs (all ABIs)
    runs-on: ubuntu-latest
    needs: [ test, lint ]

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs (arm64, armv7, x86_64, universal)
        run: bash ./gradlew :app:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LireDank-debug-apks
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/LireDank-debug*.apk

  release:
    name: Release signed APKs
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.13+9.0.LTS'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Optional: add SIGNING_KEY (base64 JKS), KEY_ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD
      # repo secrets to sign releases with the real key; otherwise the debug keystore signs them
      - name: Check signing secret
        id: signing
        env:
          HAS_KEY: ${{ secrets.SIGNING_KEY != '' }}
        run: echo "available=${HAS_KEY}" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore (optional)
        id: decode_keystore
        if: steps.signing.outputs.available == 'true'
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: '/app/keystore/LireDank.jks'
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.SIGNING_KEY }}

      - name: Extract version
        id: version
        run: |
          base=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          short_sha="${GITHUB_SHA::7}"
          tag="v${base}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=LireDank v${base} (${short_sha})" >> "$GITHUB_OUTPUT"
          echo "version=${base}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # Conventional commits since the previous release tag
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$prev_tag" ]; then
            range="HEAD"
          else
            range="${prev_tag}..HEAD"
          fi
          {
            echo "**LireDank v${{ steps.version.outputs.version }}** ([commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }}))"
            echo
            echo "### What's new"
            git log --pretty=format:'- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))' "$range" --grep='^feat\|^fix\|^perf' -E | head -30
            echo
            echo "### Fixes"
            git log --pretty=format:'- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))' "$range" --grep='^fix' -E | head -20
            echo
            echo "APKs:"
            echo "- \`LireDank-release-arm64-v8a.apk\` — modern 64-bit phones (recommended)"
            echo "- \`LireDank-release-armeabi-v7a.apk\` — older 32-bit phones"
            echo "- \`LireDank-release-x86_64.apk\` — emulators / x86 devices"
            echo "- \`LireDank-release-universal.apk\` — all architectures in one"
            echo
            echo "A fork of [DankChat](https://github.com/flex3r/DankChat) with 7TV nickname paints, badges, personal emotes and more."
          } > release-notes.md

      # The CI fallback keystore must exist before AGP validates signing
      - name: Ensure CI keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/ci-release.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/ci-release.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=LireDank CI, OU=CI, O=LireDank, L=Internet, ST=Internet, C=RU"
          fi

      - name: Build release APKs (all ABIs)
        run: bash ./gradlew :app:assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LireDank-release-apks
          path: ${{ github.workspace }}/app/build/outputs/apk/release/LireDank-release*.apk

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          prerelease: true
          artifacts: ${{ github.workspace }}/app/build/outputs/apk/release/LireDank-release*.apk
          bodyPath: release-notes.md
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
